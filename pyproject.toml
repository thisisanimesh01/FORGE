[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-core"
version = "0.1.0"
description = "FORGE: Autonomous Software Engineering Intelligence (Phase 1: Secure Repository Intelligence)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "FORGE Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
forge = "forge.cli:app"

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "fixtures", "tests/fixtures"]
pythonpath = ["app"]
addopts = "-v"
markers = [
    "docker: opt-in real Docker integration tests (requires running Docker daemon)",
]
