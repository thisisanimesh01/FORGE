name: Bug Report
description: Report a bug, defect, or unexpected behavior in FORGE
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please search existing issues first to avoid duplicates.
        **Security Note:** If you are reporting a security vulnerability or sandbox containment flaw, please refer to [SECURITY.md](https://github.com/thisisanimesh01/FORGE/blob/main/SECURITY.md) instead of creating a public issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Run command 'forge ...'
        2. Inspect output
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output & Diagnostic Logs
      description: Paste relevant command output or error messages (secrets will be automatically redacted if using `forge doctor`).
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Output of `forge doctor` or system specifications.
      placeholder: |
        - OS: [e.g. macOS 14.5, Ubuntu 22.04]
        - Python version: [e.g. 3.11.8]
        - Docker version: [e.g. 24.0.5]
        - FORGE version: [e.g. 0.1.0b1]
        - Ollama model: [e.g. qwen2.5-coder:1.5b]
    validations:
      required: true
