name: FORGE Continuous Integration & Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Enforce minimal token permissions by default
permissions:
  contents: read

jobs:
  test-and-audit:
    name: Regression Suite & Security Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies with Constraints
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements/constraints.txt
          python -m pip install pip-audit build

      - name: Run Dependency Vulnerability Audit
        run: |
          python -m pip_audit -r requirements/constraints.txt

      - name: Run Python Code Compilation Check
        run: |
          python -m compileall app/forge

      - name: Run Offline Regression Test Suite
        run: |
          pytest tests/unit tests/security

      - name: Build Distribution Packages
        run: |
          python -m build --no-isolation

      - name: Generate and Verify Release Artifacts
        run: |
          python -m forge.cli release manifest dist
          python -m forge.cli release verify dist/*.whl
          python -m forge.cli release verify dist/*.tar.gz
