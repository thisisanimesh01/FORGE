name: FORGE Release Artifact Build & Provenance Attestation

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version tag (e.g., 0.1.0b1)"
        required: true
        default: "0.1.0b1"

# Explicitly scope permissions: attestation requires id-token and attestations
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    name: Build Artifacts & Attest Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Pinned Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9dc2c792dd34f771f58a253731a66e77 # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build -c requirements/constraints.txt

      - name: Build Distribution Wheel and Source Archive
        run: |
          python -m build --no-isolation

      - name: Generate Cryptographic Manifest and Checksums
        run: |
          python -m pip install -e . -c requirements/constraints.txt
          python -m forge.cli release manifest dist --output dist/release_manifest.json --write-sums

      - name: Forensically Verify Artifacts
        run: |
          python -m forge.cli release verify dist/*.whl
          python -m forge.cli release verify dist/*.tar.gz

      - name: Attest Build Provenance (SLSA Standard)
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb7d6ae6dd9879a7db5 # v2.2.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload Verified Release Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: forge-release-artifacts-${{ github.event.inputs.release_version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/release_manifest.json
          if-no-files-found: error
          retention-days: 30
